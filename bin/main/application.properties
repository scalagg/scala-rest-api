spring.application.name=scala
server.port=30090

server.type=PVPLEAGUE

# Disable Spring banner and clean up logging
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.mongodb=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

spring.data.mongodb.uri=mongodb://100.64.0.20:27017
spring.data.mongodb.database=Scala

# Resend Email API
resend.api-key=YOUR_RESEND_API_KEY
resend.from-email=noreply@lunarlabs.dev

api.key=Mmvb500e9cZShvMgxnI44XGjyzIXOX5a

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Disable unnecessary endpoints and features
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
springdoc.show-actuator=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packagesToScan=gg.scala.restapi
